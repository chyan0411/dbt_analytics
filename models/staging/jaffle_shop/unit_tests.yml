unit_tests:
  - name: test_order_status_clean_up 
    model: stg_jaffle_shop__orders
    description: test my status case when logic
    given:
      - input: source( 'jaffle_shop', 'orders' )
        rows: 
          - {id: 1, status: returned}
          - {id: 2, status: return_pending}
          - {id: 3, status: completed}
          - {id: 4, status: pending}
          - {id: 5, status: shipped}
          - {id: 6, status: placed}
    expect:
      rows:
        - {order_id: 1, order_status: returned}
        - {order_id: 2, order_status: returned}
        - {order_id: 3, order_status: completed}
        - {order_id: 4, order_status: placed}
        - {order_id: 5, order_status: shipped}
        - {order_id: 6, order_status: placed}

  - name:  test_days_since_ordered
    description: test mt date diff for days_since_ordered
    model: stg_jaffle_shop__orders
    overrides: 
      macros:
        dbt.current_timestamp: date('2026-01-15')
    given:
      - input: source( 'jaffle_shop', 'orders' )
        rows: 
          - {order_date: 2026-01-01}
    expect:
      rows: 
        - {order_date: 2026-01-01, day_since_ordered: 14}
    
